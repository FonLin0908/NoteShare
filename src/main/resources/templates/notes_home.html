<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>筆記分享大廳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{css/gamer-custom.css}">
    <style>
        .note-card { transition: transform 0.2s ease, shadow 0.2s ease; cursor: pointer; }
        .note-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.12) !important; }
        .card-img-top { height: 180px; object-fit: cover; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/notes">📚 NoteShare 筆記平台</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto animate-align">
                <li class="nav-item d-flex align-items-center"><a class="nav-link" href="/">主頁</a></li>
                <li class="nav-item d-flex align-items-center"><a class="nav-link active" href="/notes">筆記大廳</a></li>
                <li class="nav-item d-flex align-items-center"><a class="nav-link" href="/ranking">排行榜</a></li>

                <li class="nav-item d-flex align-items-center" th:if="${user == null}">
                    <a class="nav-link btn btn-primary btn-sm text-white px-3 ms-2"
                       href="#"
                       onclick="window.location.href='/login?target=' + encodeURIComponent(window.location.href)">登入</a>
                </li>

                <li class="nav-item ms-3 dropdown d-flex align-items-center" th:unless="${user == null}">

                    <a class="nav-link dropdown-toggle d-flex align-items-center text-light border-0 p-0 pe-2"
                       href="#" id="userNavbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">

                        <span class="text-light me-3 small fw-semibold d-none d-sm-inline" th:text="${user.nickname}">使用者名稱</span>

                        <div class="avatar-frame d-flex align-items-center justify-content-center bg-dark rounded-circle"
                             style="width: 42px; height: 42px; transition: 0.3s;"
                             th:classappend="${equippedFrame != null ? equippedFrame.styleValue : 'border border-info'}"
                             th:styleappend="${equippedFrame == null ? 'box-shadow: 0 0 10px rgba(13, 202, 240, 0.3);' : ''}">

                            <img th:src="${equippedAvatar != null ? '/images/avatars/' + equippedAvatar.styleValue : 'https://api.dicebear.com/7.x/identicon/svg?seed=' + #strings.toLowerCase(#strings.trim(user.username))}"
                                 class="rounded-circle border border-2 border-info bg-white shadow-sm user-avatar-img-slot"
                                 style="width: 40px; height: 40px; object-fit: cover; transition: 0.3s;">
                        </div>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 py-3 px-2 mt-2 rounded-3" aria-labelledby="userNavbarDropdown" style="min-width: 200px; margin-top: 10px !important;">
                        <li class="px-3 py-1 mb-2">
                            <div class="fw-bold text-dark text-truncate" th:text="${user.nickname}">暱稱</div>
                            <div class="text-muted small text-truncate">@<span th:text="${user.username}">username</span></div>
                        </li>
                        <li><hr class="dropdown-divider opacity-50"></li>

                        <li class="my-1">
                            <a class="dropdown-item py-2 rounded-3 d-flex align-items-center text-dark" th:href="@{/member/{id}(id=${user.id})}">
                                <i class="bi bi-person-circle text-info fs-5 me-2"></i>
                                <span class="fw-semibold">進入個人主頁</span>
                            </a>
                        </li>

                        <li class="my-1">
                            <a class="dropdown-item py-2 rounded-3 d-flex align-items-center text-muted small" href="/dashboard">
                                <i class="bi bi-gear me-2"></i> 個人檔案後台
                            </a>
                        </li>

                        <li><hr class="dropdown-divider opacity-50"></li>

                        <li class="mt-1">
                            <a class="dropdown-item py-2 rounded-3 bg-danger-subtle text-danger fw-bold d-flex align-items-center" href="/logout">
                                <i class="bi bi-box-arrow-right fs-5 me-2"></i>
                                <span>安全登出系統</span>
                            </a>
                        </li>
                    </ul>

                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-8 mx-auto">
            <form action="/notes" method="get" class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden">

                <input type="hidden" name="type" th:value="${currentType}">
                <input type="hidden" name="sort" th:value="${currentSort}">

                <span class="input-group-text bg-white border-0 ps-4 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" name="keyword" class="form-control border-0 fs-5"
                       placeholder="搜尋筆記標題或關鍵內容...（例如：密碼學）"
                       th:value="${currentKeyword}">
                <button type="submit" class="btn btn-info fw-bold text-dark px-4 fs-5">搜尋</button>
            </form>

            <div class="text-center mt-3 small text-muted" th:if="${currentKeyword != null && !currentKeyword.isEmpty()}">
                💡 正在為您展示包含「<span class="text-info fw-bold" th:text="${currentKeyword}">關鍵字</span>」的公開筆記結果。
                <a href="/notes" class="text-decoration-none text-primary ms-2"><i class="bi bi-x-circle"></i> 清除搜尋</a>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark m-0">探索精選筆記</h2>
            <p class="text-muted m-0">與來自各地的學生一起共享知識</p>
        </div>
        <a href="/notes/create" class="btn btn-primary btn-sm px-3 shadow-sm rounded-pill d-inline-flex align-items-center text-decoration-none">
            <i class="bi bi-plus-lg me-1"></i> 發布新筆記
        </a>
    </div>

    <div class="row g-3 align-items-center justify-content-between bg-white p-3 rounded-3 shadow-sm mb-4 mx-0">
        <div class="col-12 col-md-auto d-flex flex-wrap gap-2">

            <a th:href="@{/notes(sort=${currentSort}, keyword=${currentKeyword})}"
               class="btn btn-sm rounded-pill px-3 fw-bold"
               th:classappend="${currentType == null || currentType == ''} ? 'btn-dark' : 'btn-outline-secondary'">
                全部
            </a>

            <a th:each="typeConstant : ${allNoteTypes}"
               th:href="@{/notes(type=${typeConstant.name()}, sort=${currentSort}, keyword=${currentKeyword})}"
               class="btn btn-sm rounded-pill px-3 fw-bold"
               th:classappend="${currentType == typeConstant.name()} ? 'btn-info text-dark' : 'btn-outline-secondary'"
               th:text="${typeConstant.displayName}">
                動態分類按鈕
            </a>

        </div>

        <div class="col-12 col-md-auto d-flex align-items-center gap-2">
            <span class="text-muted small text-nowrap"><i class="bi bi-sort-down me-1"></i>排序方式：</span>
            <select class="form-select form-select-sm border-secondary-subtle rounded-3 px-3"
                    id="sortSelect" onchange="changeSort(this.value)" style="width: 140px;">
                <option value="latest" th:selected="${currentSort == 'latest'}">最新發布</option>
                <option value="views" th:selected="${currentSort == 'views'}">點閱次數</option>
                <option value="likes" th:selected="${currentSort == 'likes'}">最高按讚數</option>
            </select>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="note : ${notes}">
            <div class="card h-100 border-0 shadow-sm rounded-3 note-card" th:onclick="|window.location.href='/notes/view?id=' + ${note.id}|">
                <img th:src="${note.coverImageUrl != null ? note.coverImageUrl : 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500'}"
                     class="card-img-top rounded-top-3" alt="Note Cover">
                <div class="card-body d-flex flex-column">
                    <span class="badge fw-semibold px-3 py-2 fs-6 mb-2"
                          th:classappend="${note.type != null} ? ${note.type.cssClass} : 'bg-secondary'"
                          th:text="${note.type != null} ? ${note.type.displayName} : '未分類'">
                        分類
                    </span>
                    <h5 class="card-title fw-bold text-dark lh-base" th:text="${note.title}">筆記名稱</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(note.content, 50)}">內容預覽...</p>
                    <div class="mb-3">
                                <span th:each="tag : ${#strings.arraySplit(note.tags, ',')}"
                                      class="text-secondary small me-2">#<span th:text="${tag}"></span></span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top-0 pb-3 pt-0 d-flex justify-content-between text-muted small">
                    <div>
                        <i class="bi bi-clock-history me-1"></i>
                        <span th:text="${timeUtil.format(note.createdAt)}">時間</span>
                    </div>
                    <div class="d-flex gap-3">
                        <span><i class="bi bi-eye me-1"></i><span th:text="${note.viewsCount}">0</span></span>
                        <span><i class="bi bi-heart-fill text-danger me-1"></i><span th:text="${note.likesCount}">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-5 mb-5">
        <nav aria-label="Sliding Window Note Platform Navigation">
            <ul class="pagination shadow-sm rounded-3 overflow-hidden gap-1">

                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link bg-white text-dark border-secondary-subtle px-3 py-2 transition-all d-flex align-items-center"
                       th:href="@{/notes(page=0, type=${currentType}, sort=${currentSort}, keyword=${currentKeyword})}"
                       title="直達第一頁">
                        <i class="bi bi-chevron-bar-left fw-bold text-info"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                    <a class="page-link bg-white text-dark border-secondary-subtle px-3 py-2 transition-all d-flex align-items-center"
                       th:href="@{/notes(page=${currentPage - 1}, type=${currentType}, sort=${currentSort}, keyword=${currentKeyword})}">
                        <i class="bi bi-chevron-left fw-bold text-info"></i>
                    </a>
                </li>

                <li class="page-item disabled" th:if="${currentPage > 2}">
                    <span class="page-link bg-light text-muted border-secondary-subtle px-3 py-2">...</span>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
                    th:classappend="${currentPage == i} ? 'active'">

                    <a class="page-link px-3 py-2 fw-bold border-secondary-subtle transition-all"
                       th:style="${currentPage == i} ? 'background-color: #0dcaf0; border-color: #0dcaf0; color: #000;' : 'background-color: #fff; color: #555;'"
                       th:href="@{/notes(page=${i}, type=${currentType}, sort=${currentSort}, keyword=${currentKeyword})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li class="page-item disabled" th:if="${currentPage < totalPages - 3}">
                    <span class="page-link bg-light text-muted border-secondary-subtle px-3 py-2">...</span>
                </li>

                <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                    <a class="page-link bg-white text-dark border-secondary-subtle px-3 py-2 transition-all d-flex align-items-center"
                       th:href="@{/notes(page=${currentPage + 1}, type=${currentType}, sort=${currentSort}, keyword=${currentKeyword})}">
                        <i class="bi bi-chevron-right fw-bold text-info"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link bg-white text-dark border-secondary-subtle px-3 py-2 transition-all d-flex align-items-center"
                       th:href="@{/notes(page=${totalPages - 1}, type=${currentType}, sort=${currentSort}, keyword=${currentKeyword})}"
                       title="直達最後一頁">
                        <i class="bi bi-chevron-bar-right fw-bold text-info"></i>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</div>

<script th:inline="javascript">
    const currentType = /*[[${currentType}]]*/ '' || '';
    const currentKeyword = /*[[${currentKeyword}]]*/ '' || '';

    function changeSort(sortValue) {
        // 切換排序後回到第一頁，避免沿用超出結果範圍的頁碼。
        let url = '/notes?sort=' + sortValue + '&page=0';

        if (currentType && currentType !== '') {
            url += '&type=' + encodeURIComponent(currentType);
        }
        if (currentKeyword && currentKeyword !== '') {
            url += '&keyword=' + encodeURIComponent(currentKeyword);
        }
        window.location.href = url;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
