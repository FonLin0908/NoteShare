<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="user-profile" class="w-100">

    <div class="dashboard-card p-5 mb-5 shadow transition-all"
         style="background: linear-gradient(145deg, #16161a, #1f1f2e); border-color: #444;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">

                <div class="avatar-frame me-4 d-flex align-items-center justify-content-center bg-dark rounded-circle"
                     style="width: 76px; height: 76px; transition: 0.3s;"
                     th:classappend="${equippedFrame != null ? equippedFrame.styleValue : 'border border-info'}"
                     th:styleappend="${equippedFrame == null ? 'box-shadow: 0 0 15px rgba(13, 202, 240, 0.3);' : ''}">

                    <img th:src="${equippedAvatar != null ? '/images/avatars/' + equippedAvatar.styleValue : 'https://api.dicebear.com/7.x/identicon/svg?seed=' + #strings.toLowerCase(#strings.trim(user.username))}"
                         class="rounded-circle border border-2 border-info bg-white shadow-sm user-avatar-img-slot"
                         style="width: 66px; height: 66px; object-fit: cover; transition: 0.3s;">
                </div>

                <div>
                    <h3 class="text-white fw-bold mb-1" th:text="${user.nickname}">冒險創作者</h3>

                    <span class="text-secondary small">
                        當前榮譽稱號：
                        <span th:class="${user.currentTitle != null ? 'text-warning fw-bold blink-animation' : 'text-info'}"
                              th:text="${user.currentTitle != null ? '【' + user.currentTitle + '】' : '【初試啼聲】'}">
                            【初試啼聲】
                        </span>
                    </span>
                </div>
            </div>
            <div class="text-end">
                <span class="badge bg-info text-dark fw-bold fs-5 px-3 py-2" th:text="'LV. ' + ${user.level}">LV. 4</span>
            </div>
        </div>

        <div class="progress bg-dark mb-3" style="height: 16px; border-radius: 8px;">
            <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" role="progressbar" th:style="|width: ${expPercentage}%;|"></div>
        </div>

        <div class="d-flex justify-content-between small text-secondary fw-bold">
            <span th:text="'經驗值：' + ${user.exp} + ' / ' + ${maxExp} + ' (' + ${#numbers.formatInteger(expPercentage, 1)} + '%)'">經驗值：1500 / 2000 (75%)</span>
            <span><i class="bi bi-coin text-warning me-1"></i>金幣餘額：<span th:text="${#numbers.formatInteger(user.coins, 1, 'COMMA')}">0</span> Coin</span>
        </div>

        <div class="border-top border-secondary pt-4 mt-2">
            <h6 class="text-white small fw-bold mb-3"><i class="bi bi-shield-exclamation text-warning me-2"></i>今日基礎懸賞收益上限</h6>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <div class="d-flex justify-content-between small text-secondary mb-1">
                        <span>✍️ 發布筆記獎勵次數</span>
                        <span class="text-white fw-bold" th:text="${dailyNote < 5 ? dailyNote + ' / 5 次' : '5 / 5 次 (已滿)'}">2 / 5 次</span>
                    </div>
                    <div class="progress bg-dark" style="height: 6px;">
                        <div class="progress-bar bg-success" th:style="|width: ${dailyNote * 20}%;|"></div>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="d-flex justify-content-between small text-secondary mb-1">
                        <span>💬 發表留言獎勵次數</span>
                        <span class="text-white fw-bold" th:text="${dailyComment < 10 ? dailyComment + ' / 10 次' : '10 / 10 次 (已滿)'}">10 / 10 次 (已滿)</span>
                    </div>
                    <div class="progress bg-dark" style="height: 6px;">
                        <div class="progress-bar bg-danger" th:style="|width: ${dailyComment * 10}%;|"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h5 class="text-secondary small fw-bold mb-4"><i class="bi bi-grid-fill me-2"></i>冒險者公會選單</h5>
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="quests" style="background: #19875411; border: 1px solid #198754; transition: 0.2s; min-height: 130px;">
                <i class="bi bi-journal-check text-success fs-2 mb-2"></i>
                <span>任務公告欄</span>
            </button>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="shop" style="background: #0dcaf011; border: 1px solid #0dcaf0; transition: 0.2s; min-height: 130px;">
                <i class="bi bi-shop text-info fs-2 mb-2"></i>
                <span>榮譽黑市商城</span>
            </button>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="wardrobe" style="background: #00bcd411; border: 1px solid var(--accent-color); transition: 0.2s; min-height: 130px;">
                <i class="bi bi-person-badge text-info fs-2 mb-2"></i>
                <span>個人更衣室</span>
            </button>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="medals" style="background: #ffc10711; border: 1px solid #ffc107; transition: 0.2s; min-height: 130px;">
                <i class="bi bi-trophy text-warning fs-2 mb-2"></i>
                <span>成就殿堂牆</span>
            </button>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="chronicle" style="background: #6f42c111; border: 1px solid #6f42c1; transition: 0.2s; min-height: 130px;">
                <i class="bi bi-clock-history fs-2 mb-2" style="color: #6f42c1;"></i>
                <span>冒險者編年史</span>
            </button>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <button class="btn w-100 py-4 text-white fw-bold portal-btn d-flex flex-column align-items-center justify-content-center h-100" data-target="guide" style="background: #fd7e1411; border: 1px solid #fd7e14; transition: 0.2s; min-height: 130px;">
                <i class="bi bi-book fs-2 mb-2" style="color: #fd7e14;"></i>
                <span>冒險指南手冊</span>
            </button>
        </div>
    </div>

</div>

</body>
</html>
