<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<div th:fragment="dashboard-home" class="w-100">

    <h1 class="mb-5 text-white fw-bold"><i class="bi bi-lightning-charge me-3 text-info"></i>數據分析</h1>
    <div class="row g-4">
        <div class="col-6 col-lg-3">
            <div class="dashboard-card p-4 shadow text-center h-100">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-journal-text me-2 text-warning"></i>發布筆記數量</div>
                <h2 class="text-white fw-bold mb-0" th:text="${totalNotesCount}">0</h2>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="dashboard-card p-4 shadow text-center h-100">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-chat-left-dots me-2 text-info"></i>發布留言數量</div>
                <h2 class="text-white fw-bold mb-0" th:text="${totalCommentsCount}">0</h2>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="dashboard-card p-4 shadow text-center h-100">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-person-plus-fill me-2" style="color: #a970ff;"></i>總追隨數</div>
                <h2 class="text-white fw-bold mb-0">0</h2>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="dashboard-card p-4 shadow text-center h-100">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-eye-fill me-2 text-warning"></i>總點閱數</div>
                <h2 class="text-white fw-bold mb-0" th:text="${totalViews != null ? totalViews : 0}">0</h2>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="dashboard-card p-4 shadow text-center">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-heart-fill me-2 text-danger"></i>筆記獲讚</div>
                <h2 class="text-white fw-bold mb-0" th:text="${noteLikes != null ? noteLikes : 0}">42</h2>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="dashboard-card p-4 shadow text-center">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-heart-fill me-2 text-danger"></i>留言獲讚</div>
                <h2 class="text-white fw-bold mb-0" th:text="${commentLikes != null ? commentLikes : 0}">0</h2>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="dashboard-card p-4 shadow text-center" style="border-color: var(--accent-color)">
                <div class="text-secondary small fw-bold mb-2"><i class="bi bi-fire me-2 text-danger"></i>按讚數總和</div>
                <h2 class="fw-bold mb-0" style="color: var(--accent-color)" th:text="${totalLikes != null ? totalLikes : 0}">57</h2>
            </div>
        </div>
        <div class="col-12 mt-5">
            <div class="row g-4">
                <div class="col-xl-5">
                    <div class="dashboard-card p-4 shadow h-100">
                        <h5 class="text-white mb-4"><i class="bi bi-pie-chart-fill me-2 text-info"></i>按讚數佔比</h5>
                        <div class="d-flex flex-column align-items-center justify-content-center" style="height: 280px;">
                            <div style="width: 220px; height: 220px;">
                                <canvas id="influenceChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-7">
                    <div class="dashboard-card p-4 shadow h-100">
                        <h5 class="text-white mb-4"><i class="bi bi-graph-up-arrow me-2 text-success"></i>近七日社群活躍趨勢</h5>
                        <div style="height: 280px; position: relative;">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
