<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="update-password" class="w-100" id="update-password-section-wrapper"
     th:classappend="${successMessage != null || errorMessage != null} ? '' : 'd-none'">

    <div class="dashboard-card p-4 p-md-5" style="max-width: 600px; margin: 0 auto;">
        <h3 class="fw-bold mb-4" style="color: var(--accent-color);">
            <i class="bi bi-shield-lock-fill me-2"></i>密碼變更
        </h3>
        <p class="small mb-4" style="color: #b8b8b8;">為確保帳號安全，建議定期更新您的密碼。</p>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4 border-0 shadow-sm" role="alert" style="background-color: rgba(76, 175, 80, 0.15); color: #81c784;">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">成功訊息</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 border-0 shadow-sm" role="alert" style="background-color: rgba(244, 67, 54, 0.15); color: #e57373;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">錯誤訊息</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form action="/dashboard/update-password" method="POST" onsubmit="return validateFrontendPassword()">
            <div class="mb-4">
                <label for="oldPassword" class="form-label small fw-bold" style="color: var(--text-secondary);">目前密碼 (Current Password)</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background-color: #2a2a2a; color: var(--text-secondary);"><i class="bi bi-key-fill"></i></span>
                    <input type="password" class="form-control border-0 text-white px-3 py-2" id="oldPassword" name="oldPassword" placeholder="••••••••" required style="background-color: #252525;">
                </div>
            </div>

            <hr class="my-4 opacity-25" style="border-color: #444;">

            <div class="mb-4">
                <label for="newPassword" class="form-label small fw-bold" style="color: var(--text-secondary);">新密碼 (New Password)</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background-color: #2a2a2a; color: var(--text-secondary);"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control border-0 text-white px-3 py-2" id="newPassword" name="newPassword" placeholder="輸入新密碼（至少 6 位字元）" minlength="6" required style="background-color: #252525;">
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label small fw-bold" style="color: var(--text-secondary);">確認新密碼 (Confirm Password)</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background-color: #2a2a2a; color: var(--text-secondary);"><i class="bi bi-lock-check-fill"></i></span>
                    <input type="password" class="form-control border-0 text-white px-3 py-2" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入新密碼" required style="background-color: #252525;">
                </div>
                <div id="passwordMismatchError" class="text-danger small mt-2 d-none">
                    <i class="bi bi-x-circle-fill me-1"></i> 兩次輸入的新密碼不一致，請重新檢查！
                </div>
            </div>

            <div class="text-end mt-4">
                <button type="submit" class="btn fw-bold px-4 py-2 rounded-pill shadow" style="background-color: var(--accent-color); color: #fff;">
                    <i class="bi bi-arrow-up-right-circle-fill me-1"></i> 更新密碼
                </button>
            </div>
        </form>
    </div>

    <script>
        function validateFrontendPassword() {
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('passwordMismatchError');

            if (newPwd !== confirmPwd) {
                errorDiv.classList.remove('d-none');
                return false;
            }
            errorDiv.classList.add('d-none');
            return true;
        }
    </script>
</div>
</body>
</html>
