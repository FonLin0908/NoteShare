<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <title>系統登入</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/gamer-custom.css}">
    </head>
    <body class="bg-light d-flex align-items-center" style="height: 100vh;">
        <div class="container" style="max-width: 400px;">
            <div class="card p-4 shadow-sm border-0">
                <h3 class="text-center mb-4 fw-bold">登入</h3>

                <!-- 顯示被攔截時或密碼錯誤的提示 -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${msg}" class="alert alert-warning" th:text="${msg}"></div>

                <form action="/doLogin" method="post">
                    <!-- 【核心修改】利用 hidden 屬性，在畫面上隱形，但送出表單時會把 target 帶給後端 -->
                    <input type="hidden" name="target" th:value="${target}">
                    <div class="mb-3">
                        <label class="form-label">帳號</label>
                        <input type="text" name="username" class="form-control" placeholder="請輸入使用者名稱" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密碼</label>
                        <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登入系統</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/register" class="text-decoration-none small text-primary">還沒有帳號？立即註冊新會員</a>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
