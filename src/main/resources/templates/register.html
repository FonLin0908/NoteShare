<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>帳號註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body class="bg-light d-flex align-items-center" style="height: 100vh;">
        <div class="container" style="max-width: 450px;">
            <div class="card p-4 shadow-sm border-0">
                <h3 class="text-center mb-4 fw-bold text-success">建立新帳號</h3>

                <!-- 顯示錯誤訊息 -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form action="/doRegister" method="post">
                    <div class="mb-3">
                        <label class="form-label">登入帳號 (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="建議使用英數字組合" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">自訂暱稱 (Nickname)</label>
                        <input type="text" name="nickname" class="form-control" placeholder="例如：太白粉、TaichungGamer" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">安全密碼 (Password)</label>
                        <!-- 【新增 id="password"】 -->
                        <input type="password" id="password" name="password" class="form-control" placeholder="請輸入密碼" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">確認密碼 (Confirm Password)</label>
                        <!-- 【新增 id="confirmPassword"】 -->
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="請再次輸入密碼" required>

                        <!-- 【新增】用來即時顯示紅字提示的容器 -->
                        <div id="passwordErrorMsg" class="invalid-feedback">
                            兩次輸入的密碼不一致！
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">確認註冊</button>
                    <div class="text-center">
                        <a href="/login" class="text-decoration-none small text-muted">已經有帳號了？前往登入</a>
                    </div>
                </form>
            </div>
        </div>
        <script>
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const errorMsg = document.getElementById('passwordErrorMsg');
            const submitBtn = document.querySelector('button[type="submit"]');

            // 設計一個驗證函式
            function validatePassword() {
                const pwd = passwordInput.value;
                const confirmPwd = confirmPasswordInput.value;

                // 如果確認密碼還是空的，先不打擾使用者，保持原樣
                if (confirmPwd === "") {
                    confirmPasswordInput.classList.remove('is-invalid', 'is-valid');
                    submitBtn.disabled = false;
                    return;
                }

                // 開始比對
                if (pwd === confirmPwd) {
                    // 密碼一致：移除紅色框 (is-invalid)，加上綠色框 (is-valid)
                    confirmPasswordInput.classList.remove('is-invalid');
                    confirmPasswordInput.classList.add('is-valid');
                    submitBtn.disabled = false; // 恢復按鈕點擊
                } else {
                    // 密碼不一致：移除綠色框，加上紅色框與文字提示
                    confirmPasswordInput.classList.remove('is-valid');
                    confirmPasswordInput.classList.add('is-invalid');
                    submitBtn.disabled = true; // ⚠️ 調皮鎖定：密碼打錯時，直接把註冊按鈕停用，不給按！
                }
            }

            // 監聽 input 事件：只要使用者手有在鍵盤上敲任何一個字，就會即時觸發驗證
            passwordInput.addEventListener('input', validatePassword);
            confirmPasswordInput.addEventListener('input', validatePassword);
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
