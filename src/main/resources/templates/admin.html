<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <title>秘密後台</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/gamer-custom.css">
        <link rel="stylesheet" th:href="@{/css/gamer-custom.css}">
    </head>
    <body class="container my-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/notes">📚 NoteShare 筆記平台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto animate-align">
                    <li class="nav-item d-flex align-items-center"><a class="nav-link" href="/">主頁</a></li>
                    <li class="nav-item d-flex align-items-center"><a class="nav-link" href="/notes">筆記大廳</a></li>
                    <li class="nav-item d-flex align-items-center"><a class="nav-link" href="/ranking">排行榜</a></li>

                    <li class="nav-item d-flex align-items-center" th:if="${user == null}">
                        <a class="nav-link btn btn-primary btn-sm text-white px-3 ms-2"
                           href="#"
                           onclick="window.location.href='/login?target=' + encodeURIComponent(window.location.href)">登入</a>
                    </li>

                    <li class="nav-item ms-3 dropdown d-flex align-items-center" th:unless="${user == null}">

                        <a class="nav-link dropdown-toggle d-flex align-items-center text-light border-0 p-0 pe-2"
                           href="#" id="userNavbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">

                            <span class="text-light me-3 small fw-semibold d-none d-sm-inline" th:text="${user.nickname}">使用者名稱</span>

                            <div class="avatar-frame d-flex align-items-center justify-content-center bg-dark rounded-circle"
                                 style="width: 42px; height: 42px; transition: 0.3s;"
                                 th:classappend="${equippedFrame != null ? equippedFrame.styleValue : 'border border-info'}"
                                 th:styleappend="${equippedFrame == null ? 'box-shadow: 0 0 10px rgba(13, 202, 240, 0.3);' : ''}">

                                <img th:src="${equippedAvatar != null ? '/images/avatars/' + equippedAvatar.styleValue : 'https://api.dicebear.com/7.x/identicon/svg?seed=' + #strings.toLowerCase(#strings.trim(user.username))}"
                                     class="rounded-circle border border-2 border-info bg-white shadow-sm user-avatar-img-slot"
                                     style="width: 34px; height: 34px; object-fit: cover; transition: 0.3s;">
                            </div>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 py-3 px-2 mt-2 rounded-3" aria-labelledby="userNavbarDropdown" style="min-width: 200px; margin-top: 10px !important;">
                            <li class="px-3 py-1 mb-2">
                                <div class="fw-bold text-dark text-truncate" th:text="${user.nickname}">暱稱</div>
                                <div class="text-muted small text-truncate">@<span th:text="${user.username}">username</span></div>
                            </li>
                            <li><hr class="dropdown-divider opacity-50"></li>

                            <li class="my-1">
                                <a class="dropdown-item py-2 rounded-3 d-flex align-items-center text-dark" th:href="@{/member/{id}(id=${user.id})}">
                                    <i class="bi bi-person-circle text-info fs-5 me-2"></i>
                                    <span class="fw-semibold">進入個人主頁</span>
                                </a>
                            </li>

                            <li class="my-1">
                                <a class="dropdown-item py-2 rounded-3 d-flex align-items-center text-muted small" href="/dashboard">
                                    <i class="bi bi-gear me-2"></i> 個人檔案後台
                                </a>
                            </li>

                            <li><hr class="dropdown-divider opacity-50"></li>

                            <li class="mt-1">
                                <a class="dropdown-item py-2 rounded-3 bg-danger-subtle text-danger fw-bold d-flex align-items-center" href="/logout">
                                    <i class="bi bi-box-arrow-right fs-5 me-2"></i>
                                    <span>安全登出系統</span>
                                </a>
                            </li>
                        </ul>

                    </li>
                </ul>
            </div>
        </div>
    </nav>
        <div class="alert alert-success p-5 rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold">🔒 成功進入機密後台！</h1>
            <p class="lead">恭喜 <span class="text-danger fw-bold" th:text="${username}">管理員</span>，您看到了未登入者無法瀏覽的防護網頁。</p>
            <hr class="my-4">
            <p>這個頁面受到 <code>LoginInterceptor</code> 的全天候保護。</p>
            <a class="btn btn-outline-danger" href="/logout">安全登出</a>
            <a class="btn btn-outline-secondary px-4" href="/member">進入用戶介面</a>
            <a class="btn btn-outline-secondary px-4" href="/">回首頁</a>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
